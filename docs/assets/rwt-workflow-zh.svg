<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-labelledby="title desc">
<title id="title">一条研究线，一份可恢复的记录</title>
<desc id="desc">Question, literature, validation, writing and review are connected by local statements, sources, evidence, artifacts, activities and a checkpoint.</desc>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="1280" height="330" rx="20" fill="#F6F2E8" stroke="none"/>
<text x="38" y="49" font-size="25" fill="#102F2B" font-weight="700">一条研究线，一份可恢复的记录</text>
<rect x="38" y="83" width="224" height="100" rx="12" fill="#FFFFFF" stroke="#D5DED1"/>
<text x="55" y="113" font-size="12" fill="#678473" font-weight="700">01</text>
<text x="55" y="140" font-size="20" fill="#102F2B" font-weight="700">明确问题</text>
<text x="55" y="165" font-size="14" fill="#52675E" font-weight="400">研究约束与候选</text>
<path d="M265 132 h13 m-5 -4 l5 4 -5 4" fill="none" stroke="#678473" stroke-width="2"/>
<rect x="283" y="83" width="224" height="100" rx="12" fill="#FFFFFF" stroke="#D5DED1"/>
<text x="300" y="113" font-size="12" fill="#678473" font-weight="700">02</text>
<text x="300" y="140" font-size="20" fill="#102F2B" font-weight="700">查阅文献</text>
<text x="300" y="165" font-size="14" fill="#52675E" font-weight="400">来源与支持范围</text>
<path d="M510 132 h13 m-5 -4 l5 4 -5 4" fill="none" stroke="#678473" stroke-width="2"/>
<rect x="528" y="83" width="224" height="100" rx="12" fill="#FFFFFF" stroke="#D5DED1"/>
<text x="545" y="113" font-size="12" fill="#678473" font-weight="700">03</text>
<text x="545" y="140" font-size="20" fill="#102F2B" font-weight="700">证明 / 实验</text>
<text x="545" y="165" font-size="14" fill="#52675E" font-weight="400">最小验证与结果</text>
<path d="M755 132 h13 m-5 -4 l5 4 -5 4" fill="none" stroke="#678473" stroke-width="2"/>
<rect x="773" y="83" width="224" height="100" rx="12" fill="#FFFFFF" stroke="#D5DED1"/>
<text x="790" y="113" font-size="12" fill="#678473" font-weight="700">04</text>
<text x="790" y="140" font-size="20" fill="#102F2B" font-weight="700">写作 / 图件</text>
<text x="790" y="165" font-size="14" fill="#52675E" font-weight="400">正文与可编辑产物</text>
<path d="M1000 132 h13 m-5 -4 l5 4 -5 4" fill="none" stroke="#678473" stroke-width="2"/>
<rect x="1018" y="83" width="224" height="100" rx="12" fill="#FFFFFF" stroke="#D5DED1"/>
<text x="1035" y="113" font-size="12" fill="#678473" font-weight="700">05</text>
<text x="1035" y="140" font-size="20" fill="#102F2B" font-weight="700">审阅 / 返修</text>
<text x="1035" y="165" font-size="14" fill="#52675E" font-weight="400">问题清单与回复</text>
<rect x="38" y="211" width="1204" height="81" rx="12" fill="#102F2B" stroke="none"/>
<text x="62" y="244" font-size="19" fill="#F6F2E8" font-weight="600">本地记录：主张 · 来源 · 证据 · 产物 · 活动</text>
<text x="62" y="273" font-size="16" fill="#B5C6B9" font-weight="400">保存检查点，重新检查文件变化，再恢复下一步。</text>
<text x="1090" y="258" font-size="19" fill="#D6EF93" font-weight="700">↻ RESUME</text>
</g></svg>
