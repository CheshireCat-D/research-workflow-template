<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="76mm" viewBox="0 0 640 304" role="img" aria-labelledby="figure:title figure:desc">
  <title id="figure:title">Synthetic editable workflow demonstration</title>
  <desc id="figure:desc">Synthetic example, not research evidence. Input records pass through a check to a summary. A dashed possible revision edge is an illustrative inference unsupported by the fictional note. Text, boxes and arrows are separate editable SVG elements.</desc>
  <defs>
    <marker id="marker:arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#24364b"/></marker>
  </defs>
  <rect id="canvas:background" width="640" height="304" fill="#ffffff"/>
  <g id="notice:synthetic" font-family="sans-serif" fill="#24364b">
    <text x="32" y="32" font-size="14" font-weight="bold">SYNTHETIC DEMONSTRATION</text>
    <text x="32" y="53" font-size="12">Editable source example; not research evidence</text>
  </g>
  <g id="edges:direct" fill="none" stroke="#24364b" stroke-width="2" marker-end="url(#marker:arrow)">
    <path id="edge:input-check" d="M 192 132 H 244"/>
    <path id="edge:check-summary" d="M 396 132 H 448"/>
  </g>
  <path id="edge:possible-revision" d="M 524 164 V 214 H 320 V 166" fill="none" stroke="#24364b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#marker:arrow)"/>
  <g font-family="sans-serif" font-size="16" text-anchor="middle" fill="#24364b">
    <g id="node:input"><rect x="40" y="100" width="152" height="64" rx="6" fill="#e8f0f8" stroke="#426c94"/><text x="116" y="138">Input records</text></g>
    <g id="node:check"><rect x="244" y="100" width="152" height="64" rx="6" fill="#e8f0f8" stroke="#426c94"/><text x="320" y="138">Check</text></g>
    <g id="node:summary"><rect x="448" y="100" width="152" height="64" rx="6" fill="#e8f0f8" stroke="#426c94"/><text x="524" y="138">Summary</text></g>
  </g>
  <g id="legend:relationships" font-family="sans-serif" font-size="12" fill="#24364b">
    <text x="354" y="238">Possible revision (inference)</text>
    <text x="32" y="278">Solid: direct synthetic note · Dashed: illustrative inference</text>
  </g>
</svg>
