name: Check template

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -B tools/check_core.py --test-timeout 360
      - run: python -B tools/release_package.py check
      - run: python -B tools/package_user.py check
      - name: Build, verify and exercise the current user package
        run: |
          mkdir -p dist
          python -B tools/package_user.py build --output dist/research-workflow-template.zip
          python -B tools/package_user.py verify --archive dist/research-workflow-template.zip
          python -B tools/package_user.py smoke --archive dist/research-workflow-template.zip
      - name: Check an internal source archive with an empty home
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import sys
          import tempfile
          import zipfile

          with tempfile.TemporaryDirectory(prefix='rw-source-release-') as temporary:
              base = Path(temporary)
              archive = base / 'source.zip'
              subprocess.run([sys.executable, '-B', 'tools/release_package.py', 'build',
                              '--output', str(archive)], check=True)
              subprocess.run([sys.executable, '-B', 'tools/release_package.py', 'verify',
                              '--archive', str(archive)], check=True)
              with zipfile.ZipFile(archive) as package:
                  prefix = package.namelist()[0].split('/')[0]
                  package.extractall(base / 'source')
              home = base / 'home'
              scratch = base / 'tmp'
              home.mkdir()
              scratch.mkdir()
              environment = dict(os.environ, HOME=str(home), TMPDIR=str(scratch),
                                 PYTHONDONTWRITEBYTECODE='1')
              root = base / 'source' / prefix
              subprocess.run([sys.executable, '-I', '-B', 'tools/check_core.py',
                              '--test-timeout', '360'], cwd=root, env=environment, check=True)
              subprocess.run([sys.executable, '-I', '-B', 'tools/release_package.py', 'check'],
                             cwd=root, env=environment, check=True)
          PY
