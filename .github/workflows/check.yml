name: Check template

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        # Keep hosted Intel macOS separate from local Apple Silicon coverage;
        # the arm64 pool reported capacity cancellations during validation.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check native Windows storage and writer locking
        if: runner.os == 'Windows'
        run: python -X utf8 -B -m unittest discover -s tests -p test_windows_storage.py -v
      - name: Check native Windows skill publication and rollback
        if: runner.os == 'Windows'
        run: python -X utf8 -B -m unittest discover -s tests -p test_windows_bundle.py -v
      - name: Check Windows CLI UTF-8 behavior
        if: runner.os == 'Windows'
        run: python -X utf8 -B -m unittest discover -s tests -p test_cli_encoding.py -v
      - name: Check bounded diagnostic output
        if: runner.os == 'Windows'
        run: python -X utf8 -B -m unittest discover -s tests -p test_check_runner.py -v
      - run: python -X utf8 -B tools/check_core.py --test-timeout 900
      - run: python -B tools/release_package.py check
      - run: python -B tools/package_user.py check
      - name: Build, verify and exercise the current user package
        run: |
          python -c "from pathlib import Path; Path('dist').mkdir(exist_ok=True)"
          python -B tools/package_user.py build --output dist/research-workflow-template.zip
          python -B tools/package_user.py verify --archive dist/research-workflow-template.zip
          python -B tools/package_user.py smoke --archive dist/research-workflow-template.zip
      - name: Check an internal source archive with an empty home
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import sys
          import tempfile
          import zipfile

          with tempfile.TemporaryDirectory(prefix='rw-source-release-') as temporary:
              base = Path(temporary)
              archive = base / 'source.zip'
              subprocess.run([sys.executable, '-B', 'tools/release_package.py', 'build',
                              '--output', str(archive)], check=True)
              subprocess.run([sys.executable, '-B', 'tools/release_package.py', 'verify',
                              '--archive', str(archive)], check=True)
              with zipfile.ZipFile(archive) as package:
                  prefix = package.namelist()[0].split('/')[0]
                  package.extractall(base / 'source')
              home = base / 'home'
              scratch = base / 'tmp'
              home.mkdir()
              scratch.mkdir()
              environment = dict(os.environ, HOME=str(home), USERPROFILE=str(home),
                                 TMPDIR=str(scratch), TMP=str(scratch), TEMP=str(scratch),
                                 PYTHONDONTWRITEBYTECODE='1', PYTHONUTF8='1')
              root = base / 'source' / prefix
              subprocess.run([sys.executable, '-X', 'utf8', '-I', '-B', 'tools/check_core.py',
                              '--test-timeout', '900'], cwd=root, env=environment, check=True)
              subprocess.run([sys.executable, '-X', 'utf8', '-I', '-B', 'tools/release_package.py', 'check'],
                             cwd=root, env=environment, check=True)
          PY
